<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradados Selva Misionera Profunda & Esmeralda -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="35%" stop-color="#0a4d2e"/>
      <stop offset="70%" stop-color="#11693e"/>
      <stop offset="100%" stop-color="#168052"/>
    </linearGradient>

    <!-- Degradado Dorado Solar de Misiones -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Degradado Pico de Tucán Toco Realista -->
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="90%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Degradado Cascadas de Cataratas -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Degradado Follaje Selva -->
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <!-- Sombras dimensionales -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Contenedor Base redondeado con bisel suave -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="120" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- Halo de luz cálida de selva -->
  <circle cx="256" cy="220" r="185" fill="#fde047" opacity="0.07" filter="url(#softGlow)"/>

  <!-- Follaje Tropical Misionero / Palmeras y Helechos de fondo -->
  <path d="M50 430 C90 280 210 270 270 340 C200 410 110 450 50 430 Z" fill="url(#leafGrad2)" opacity="0.4"/>
  <path d="M462 430 C422 280 302 270 242 340 C312 410 402 450 462 430 Z" fill="url(#leafGrad1)" opacity="0.4"/>
  <path d="M10 260 C70 190 170 200 200 260 C140 290 60 300 10 260 Z" fill="url(#leafGrad1)" opacity="0.25"/>

  <!-- Cataratas del Iguazú Estilizadas al Pie -->
  <g opacity="0.9">
    <path d="M90 410 Q180 380 256 395 T422 410 L435 460 Q256 490 77 460 Z" fill="url(#waterGrad)" filter="url(#dropShadow)"/>
    <!-- Cortinas de agua verticales -->
    <path d="M140 400 L145 455 M190 390 L195 462 M256 395 L256 468 M320 392 L317 464 M370 402 L366 456" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round"/>
    <path d="M120 445 Q256 430 392 445 L402 468 Q256 492 112 468 Z" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- TUKI: El Tucán Asistente Inteligente -->
  <g filter="url(#dropShadow)">
    <!-- Cuerpo y plumaje negro azulado aterciopelado -->
    <path d="M195 190 C195 125 255 90 310 108 C335 118 350 142 350 175 C350 245 330 340 275 372 C230 372 195 325 195 255 Z" fill="#0f172a"/>
    <path d="M210 220 C220 160 265 120 315 130 C340 180 325 280 275 345 C235 340 215 290 210 220 Z" fill="#1e293b" opacity="0.8"/>

    <!-- Pechera amarilla radiante con borde rojo tenue -->
    <path d="M245 150 C290 138 335 158 340 210 C345 252 320 290 275 290 C238 290 234 232 245 150 Z" fill="#facc15"/>
    <path d="M250 170 C280 158 320 174 324 216 C324 248 304 274 275 274 C252 274 246 232 250 170 Z" fill="#fef08a"/>
    <!-- Borde rojo vivo en la pechera del tucán -->
    <path d="M255 270 C285 275 315 255 330 230 C325 270 290 290 260 286 Z" fill="#ef4444" opacity="0.75"/>

    <!-- Anillo ocular azul cielo y ojo expresivo -->
    <ellipse cx="296" cy="162" rx="20" ry="18" fill="#38bdf8"/>
    <ellipse cx="297" cy="162" rx="17" ry="15" fill="#0284c7"/>
    <circle cx="298" cy="162" r="10" fill="#090d16"/>
    <!-- Destello de vida en la mirada -->
    <circle cx="302" cy="158" r="3.5" fill="#ffffff"/>
    <circle cx="294" cy="166" r="1.5" fill="#ffffff"/>

    <!-- Pico majestuoso de Tucán Toco -->
    <path d="M322 142 C375 136 460 178 438 248 C385 264 326 218 322 188 Z" fill="url(#beakGrad)"/>
    <!-- Mancha negra característica en la punta del pico -->
    <path d="M412 198 C440 210 436 248 408 243 C396 238 402 210 412 198 Z" fill="#090d16"/>
    <!-- Línea divisoria del pico -->
    <path d="M322 190 Q370 196 432 232" stroke="#78350f" stroke-width="2.5" fill="none" opacity="0.6"/>

    <!-- Ala detallada -->
    <path d="M200 255 C222 242 252 262 248 316 C238 348 210 358 194 326 C186 304 188 274 200 255 Z" fill="#090d16"/>
  </g>

  <!-- Destello de Inteligencia Artificial / Asistente Guía -->
  <g filter="url(#dropShadow)">
    <path d="M136 132 L144 154 L166 162 L144 170 L136 192 L128 170 L106 162 L128 154 Z" fill="url(#goldGrad)"/>
    <circle cx="136" cy="162" r="4" fill="#ffffff"/>

    <path d="M182 86 L186 98 L198 102 L186 106 L182 118 L178 106 L166 102 L178 98 Z" fill="#fde047" opacity="0.95"/>
    <path d="M380 96 L383 105 L392 108 L383 111 L380 120 L377 111 L368 108 L377 105 Z" fill="#38bdf8" opacity="0.85"/>
  </g>
</svg>
