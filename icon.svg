<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3d24"/>
      <stop offset="50%" stop-color="#115e38"/>
      <stop offset="100%" stop-color="#168052"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fondo redondeado Selva Moderna -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Hojas y vegetación decorativa de fondo -->
  <path d="M70 440 C110 320 200 300 256 360 C200 420 120 460 70 440 Z" fill="#1b7348" opacity="0.45"/>
  <path d="M442 440 C402 320 312 300 256 360 C312 420 392 460 442 440 Z" fill="#13683f" opacity="0.45"/>

  <!-- Círculo halo sutil -->
  <circle cx="256" cy="240" r="160" fill="#ffffff" opacity="0.06"/>

  <!-- Cuerpo y Cabeza del Asistente Tucán (Tuki) -->
  <g filter="url(#shadow)">
    <!-- Cuerpo negro azulado -->
    <path d="M210 180 C210 120 270 90 320 110 C340 120 350 140 350 170 C350 240 330 330 280 370 C240 370 210 330 210 260 Z" fill="#1e293b"/>

    <!-- Pechera amarilla radiante -->
    <path d="M250 150 C290 140 330 160 335 210 C340 250 315 285 275 285 C245 285 240 230 250 150 Z" fill="#fef08a"/>
    <path d="M255 170 C280 160 315 175 320 215 C320 245 300 270 275 270 C255 270 250 230 255 170 Z" fill="#fde047"/>

    <!-- Ojo azul turquesa -->
    <circle cx="295" cy="165" r="18" fill="#38bdf8"/>
    <circle cx="298" cy="165" r="10" fill="#0f172a"/>
    <circle cx="301" cy="162" r="3" fill="#ffffff"/>

    <!-- Pico icónico del Tucán -->
    <path d="M320 145 C370 140 450 180 430 245 C380 260 325 215 320 190 Z" fill="url(#beakGrad)"/>
    <!-- Punta negra del pico -->
    <path d="M410 200 C435 210 430 245 405 240 C395 235 400 210 410 200 Z" fill="#0f172a"/>

    <!-- Detalle ala -->
    <path d="M215 250 C235 240 260 260 255 310 C245 340 220 350 205 320 C198 300 200 270 215 250 Z" fill="#0f172a"/>
  </g>

  <!-- Cascadas de Iguazú estilizadas al pie -->
  <path d="M120 420 Q180 400 256 415 T392 420 L400 450 Q256 470 112 450 Z" fill="#38bdf8" opacity="0.85"/>
  <path d="M150 435 Q256 420 362 435 L370 460 Q256 480 142 460 Z" fill="#7dd3fc" opacity="0.6"/>

  <!-- Brillo de Estrella de Asistente Inteligente (Sparkle) -->
  <path d="M140 140 L146 158 L164 164 L146 170 L140 188 L134 170 L116 164 L134 158 Z" fill="#fbbf24"/>
  <path d="M180 100 L183 110 L193 113 L183 116 L180 126 L177 116 L167 113 L177 110 Z" fill="#fef08a"/>
</svg>