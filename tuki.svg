<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="tukiBeak" x1="0%" y1="0%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#facc15"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="tukiChest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="tukiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fondo circular selva suave -->
  <circle cx="100" cy="100" r="92" fill="#eef8f2" stroke="#22a36b" stroke-width="4"/>
  <circle cx="100" cy="100" r="84" fill="#0d4a2b"/>

  <!-- Destello de fondo -->
  <circle cx="100" cy="85" r="60" fill="#fde047" opacity="0.12"/>

  <!-- Tuki Head & Body -->
  <g filter="url(#tukiGlow)">
    <!-- Plumaje cabeza y cuello -->
    <path d="M68 85 C68 48 100 32 128 42 C142 48 152 62 152 82 C152 120 138 160 110 174 C86 174 68 150 68 115 Z" fill="#090d16"/>
    <path d="M76 98 C82 62 110 44 135 50 C146 76 138 135 110 162 C88 158 76 130 76 98 Z" fill="#1e293b" opacity="0.6"/>

    <!-- Pechera brillante con ribete carmín -->
    <path d="M96 68 C120 62 144 72 148 100 C150 125 136 146 112 146 C92 146 88 114 96 68 Z" fill="url(#tukiChest)"/>
    <path d="M102 134 C120 138 136 126 142 110 C138 134 118 146 102 144 Z" fill="#ef4444" opacity="0.8"/>

    <!-- Ojo azul celeste expresivo y curioso -->
    <ellipse cx="122" cy="74" rx="13" ry="12" fill="#38bdf8"/>
    <ellipse cx="123" cy="74" rx="10" ry="9" fill="#0284c7"/>
    <circle cx="124" cy="74" r="6.5" fill="#090d16"/>
    <!-- Brillo vivo en la mirada de Tuki -->
    <circle cx="126" cy="71" r="2.5" fill="#ffffff"/>
    <circle cx="121" cy="77" r="1.2" fill="#ffffff"/>

    <!-- Pico icónico de Tucán Toco -->
    <path d="M138 60 C166 56 208 80 196 122 C168 132 140 106 138 88 Z" fill="url(#tukiBeak)"/>
    <!-- Punta negra del pico -->
    <path d="M182 92 C198 98 195 122 178 120 C172 116 176 98 182 92 Z" fill="#090d16"/>
    <!-- Línea divisoria suave -->
    <path d="M138 90 Q164 94 192 115" stroke="#78350f" stroke-width="1.8" fill="none" opacity="0.5"/>
  </g>

  <!-- Pequeña estrellita dorada de Asistente Turístico -->
  <path d="M52 50 L56 62 L68 66 L56 70 L52 82 L48 70 L36 66 L48 62 Z" fill="#facc15"/>
  <circle cx="52" cy="66" r="2" fill="#ffffff"/>
</svg>
